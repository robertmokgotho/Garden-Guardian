<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="icon" type="image/png" th:href="@{/images/Garden-Guardian.png}">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
<div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
  <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Contact Us</h2>
  <form id="contactForm" class="space-y-4">
    <div>
      <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
      <input type="text" id="name" name="name" class="mt-1 p-2 w-full border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
      <p class="text-red-500 text-sm mt-1 hidden" id="nameError">Please enter your name.</p>
    </div>
    <div>
      <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
      <input type="email" id="email" name="email" class="mt-1 p-2 w-full border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
      <p class="text-red-500 text-sm mt-1 hidden" id="emailError">Please enter a valid email address.</p>
    </div>
    <div>
      <label for="message" class="block text-sm font-medium text-gray-700">Message</label>
      <textarea id="message" name="message" rows="4" class="mt-1 p-2 w-full border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required></textarea>
      <p class="text-red-500 text-sm mt-1 hidden" id="messageError">Please enter your message.</p>
    </div>
    <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500">Submit</button>
  </form>
  <p id="formMessage" class="text-center mt-4 text-green-500 hidden">Thank you! Your message has been sent.</p>
</div>

<script>
  document.getElementById('contactForm').addEventListener('submit', async function (event) {
      event.preventDefault();

      // Reset error messages
      document.getElementById('nameError').classList.add('hidden');
      document.getElementById('emailError').classList.add('hidden');
      document.getElementById('messageError').classList.add('hidden');
      document.getElementById('formMessage').classList.add('hidden');

      // Get form values
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const message = document.getElementById('message').value.trim();

      // Client-side validation
      let isValid = true;
      if (!name) {
          document.getElementById('nameError').classList.remove('hidden');
          isValid = false;
      }
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          document.getElementById('emailError').classList.remove('hidden');
          isValid = false;
      }
      if (!message) {
          document.getElementById('messageError').classList.remove('hidden');
          isValid = false;
      }

      if (isValid) {
          try {
              const response = await fetch('/api/contact', {
                  method: 'POST',
                  headers: {
                      'Content-Type': 'application/json',
                  },
                  body: JSON.stringify({ name, email, message }),
              });

              if (response.ok) {
                  document.getElementById('formMessage').classList.remove('hidden');
                  document.getElementById('contactForm').reset();
              } else {
                  alert('Failed to send message. Please try again later.');
              }
          } catch (error) {
              alert('An error occurred. Please try again later.');
          }
      }
  });
</script>
</body>
</html>
