<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Pest Tool Result</title>
  <link rel="stylesheet" th:href="@{css/pest.css}">
    <link rel="icon" type="image/png" th:href="@{/images/Garden-Guardian.png}">
</head>
<body>

<header>
    <div class="logo">
        <img th:src="@{/images/Garden-Guardian.png}" alt="" width="70" height="70">
        <a href="#" class="brand">Garden-Guardian</a>
    </div>
        <div class="menu-btn"></div>
        <nav>
            <ul>
                <li><a th:href="@{/}">Home</a></li>
                <li><a th:href="@{#}">Solutions </a>
                    <ul>
                        <li><a th:href="@{/water}">Water Calculator</a></li>
                        <li><a th:href="@{/calculator}">Space Calculator</a></li>
                    </ul>
                </li>
                <li><a th:href="@{/about}">About US</a></li>
                <li><a th:href="@{/logout}">Logout</a></li>
            </ul>
        </nav>
</header>

<div class="main-content">
  <h1>Pest Identification Result</h1>
    <div class="result">
      <p><strong>Pest Name:</strong> <span th:text="${pestOutput.pestName}"></span></p>
      <p><strong>Treatment Method:</strong> <span th:text="${pestOutput.treatmentMethod}"></span></p>
      <p><strong>Spray Amount:</strong> <span th:text="${pestOutput.sprayAmount} + ' liters'"></span></p>
      <p><strong>Total Cost:</strong> <span th:text="'R' + ${pestOutput.totalCost}"></span></p>
      <p class="back-btn"><a th:href="@{/pest-tool}">Back to Form</a></p>
    </div>
    
</div>

<div th:replace="fragments/chatbot :: chatbot"></div>

</body>
</html>
